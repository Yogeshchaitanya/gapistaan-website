  .shelf-book{width:min(42vw,230px);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1;margin-bottom:14px}
  .b3d{position:relative;display:block;width:100%;aspect-ratio:520/738;perspective:900px}
  .b3d img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:2px 6px 6px 2px;transform:rotateY(-14deg);transform-origin:left center;transition:transform .45s cubic-bezier(.3,.7,.3,1),box-shadow .45s;
    box-shadow:14px 16px 26px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.06)}
  .b3d::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:2px 6px 6px 2px;transform:rotateY(-14deg);transform-origin:left center;transition:transform .45s;
    background:linear-gradient(90deg,rgba(0,0,0,.55) 0,rgba(255,255,255,.14) 2.2%,rgba(0,0,0,.2) 4.5%,rgba(0,0,0,0) 8%),linear-gradient(120deg,rgba(255,255,255,.14),rgba(255,255,255,0) 40%)}
  .b3d .edge{position:absolute;top:1.5%;bottom:1.5%;right:-3.5%;width:6%;background:repeating-linear-gradient(90deg,#efe6d2 0 1px,#c9bc9f 1px 2px);transform:rotateY(-14deg) translateZ(-1px);transform-origin:left center;border-radius:0 3px 3px 0}
  .shelf-book:hover .b3d img,.shelf-book:hover .b3d::before,.shelf-book:focus-visible .b3d img{transform:rotateY(-4deg) translateY(-6px)}
  .shelf-book:active .b3d img{transform:rotateY(-30deg) scale(.98)}
  .shelf-book b{font-weight:600;font-size:16px;color:var(--gold2);margin-top:8px}
  .shelf-book small{font-size:12.5px;color:var(--mute);line-height:1.3}
  .note{margin:34px 0 0;color:var(--mute);font-size:14px}
  .foot{margin-top:22px;font-size:12.5px;color:#7d7262}
