name: YouTube sync

# हर घंटे YouTube से नए वीडियो लाता है, साइट दोबारा बनाता है और बदलाव होने पर ही commit करता है।
# Actions टैब में "Run workflow" दबाकर इसे कभी भी हाथ से भी चला सकते हैं।
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: API key अभी नहीं डाली गई
        if: env.YT_API_KEY == ''
        run: echo "::notice::YT_API_KEY secret नहीं मिला, इसलिए YouTube सिंक छोड़ा गया। Key डालते ही अपने-आप चलने लगेगा।"

      - name: YouTube से वीडियो लाओ
        if: env.YT_API_KEY != ''
        run: node scripts/fetch-videos.mjs

      - name: साइट बनाओ
        run: node scripts/build.mjs

      - name: बदलाव हों तो commit करो
        run: |
          if [ -n "$(git status --porcelain data dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data dist
            git commit -m "YouTube से नए वीडियो सिंक किए"
            git push
          else
            echo "कोई नया बदलाव नहीं"
          fi
