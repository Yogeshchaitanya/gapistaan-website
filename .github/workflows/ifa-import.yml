name: IFA import (one-off)
on:
  push:
    branches: [ifa-import]
    paths: [.github/workflows/ifa-import.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the live preview after the payment deploy
        run: |
          B=https://ifa-website.itsyogeshkumarmishra.workers.dev
          mkdir -p ifa-import; out=ifa-import/live-check.txt; : > $out
          echo "home: $(curl -s -o /dev/null -w '%{http_code}' $B/)" >> $out
          echo "admission: $(curl -s -o /dev/null -w '%{http_code}' $B/admission/)" >> $out
          echo "guides: $(curl -s -o /dev/null -w '%{http_code}' $B/guides/bhojpuri-film-acting/)" >> $out
          echo "order (expect 503 until keys): $(curl -s -X POST -H 'content-type: application/json' -d '{"kind":"registration"}' -w ' %{http_code}' $B/api/order)" >> $out
          echo "admin (expect 404): $(curl -s -o /dev/null -w '%{http_code}' "$B/api/admin?key=x")" >> $out
          echo "old cinekar redirect: $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' $B/cinekar/actor/)" >> $out
          cat $out
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $out && git commit -m "live check" && git push || true
