name: IFA import (one-off)
on:
  push:
    branches: [ifa-import]
    paths: [.github/workflows/ifa-import.yml]
permissions:
  contents: write
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Full DNS picture before moving the domain to Cloudflare
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y dnsutils whois >/dev/null || true
          mkdir -p ifa-import && out=ifa-import/dns.txt; : > $out
          for d in indianfilmsacademy.com ymatsystem.com; do
            echo "########## $d" >> $out
            whois $d 2>/dev/null | grep -iE "registrar:|registrar url|name server|creation date|expiry|registry expiry" | sort -u >> $out
            for t in NS SOA A AAAA MX TXT CAA; do echo "== $t $d" >> $out; dig +short $t $d @1.1.1.1 >> $out; done
            for n in www mail webmail ftp autodiscover autoconfig _dmarc hostingermail-a._domainkey hostingermail-b._domainkey hostingermail-c._domainkey default._domainkey _domainkey google._domainkey email smtp imap pop cpanel; do
              r=$(dig +short ANY $n.$d @1.1.1.1; dig +short CNAME $n.$d @1.1.1.1; dig +short TXT $n.$d @1.1.1.1; dig +short A $n.$d @1.1.1.1)
              [ -n "$r" ] && { echo "== $n.$d" >> $out; echo "$r" | sort -u >> $out; }
            done
            for s in _imaps._tcp _submission._tcp _autodiscover._tcp _pop3s._tcp; do r=$(dig +short SRV $s.$d @1.1.1.1); [ -n "$r" ] && echo "== SRV $s.$d: $r" >> $out; done
          done
          cat $out
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ifa-import/dns.txt && git commit -m "DNS snapshot before moving to Cloudflare" && git push || true
