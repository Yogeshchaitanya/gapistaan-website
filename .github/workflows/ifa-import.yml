name: IFA import (one-off)
on:
  push:
    branches: [ifa-import]
    paths: [.github/workflows/ifa-import.yml]
permissions:
  contents: write
jobs:
  reels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Old site's testimonial reels -> short silent loops, posters and light full versions
        run: |
          set -u
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null || true
          mkdir -p ifa-import/reels && cd ifa-import/reels
          UA="Mozilla/5.0 (IFA site migration by owner)"
          : > info.txt
          for u in $(awk '{print $1}' ../videos.txt); do
            name=$(basename "$u" .mp4); slug=$(echo "$name" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]\+/-/g; s/-$//')
            curl -sS -A "$UA" -f "$u" -o src.mp4 || { echo "MISS $u" >> info.txt; continue; }
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 src.mp4 | cut -d. -f1)
            wh=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 src.mp4)
            # 8-second silent loop for the page (starts at 1s), 360px wide
            ffmpeg -v error -y -ss 1 -t 8 -i src.mp4 -an -vf "scale=360:-2,fps=24" -c:v libx264 -preset slow -crf 30 -pix_fmt yuv420p -movflags +faststart "loop-$slug.mp4"
            ffmpeg -v error -y -ss 1.5 -i src.mp4 -frames:v 1 -vf "scale=540:-2" -q:v 4 "poster-$slug.jpg"
            # full version with sound, 540px wide, kept under ~22 MB
            kbps=$(( 22000*8/ (dur>0?dur:60) - 96 )); [ $kbps -gt 1100 ] && kbps=1100; [ $kbps -lt 300 ] && kbps=300
            ffmpeg -v error -y -i src.mp4 -vf "scale=540:-2" -c:v libx264 -preset slow -b:v ${kbps}k -maxrate ${kbps}k -bufsize $((kbps*2))k -pix_fmt yuv420p -c:a aac -b:a 96k -ac 2 -movflags +faststart "full-$slug.mp4"
            echo "$slug dur=${dur}s src=${wh} loop=$(stat -c%s loop-$slug.mp4) full=$(stat -c%s full-$slug.mp4) kbps=$kbps" >> info.txt
            rm -f src.mp4
          done
          cat info.txt; du -sh .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ifa-import/reels
          git commit -m "IFA: testimonial reels compressed for the new site" || echo nothing
          git push
