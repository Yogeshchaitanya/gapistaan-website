:root{
  --haldi:#F5B800;
  --sindoor:#C9221B;
  --sindoor-gaadha:#A11812;
  --neel:#1C2B7E;
  --neon:#FF2E8A;
  --kaala:#000;
  --safed:#fff;
  --dhuaan:#4A4A4A;
  --rekha:#E2E2E2;
  --whatsapp:#25D366;
  --display:"Rozha One","Noto Serif Devanagari",serif;
  --body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:1rem}
body{margin:0;background:var(--safed);color:var(--kaala);font:400 1.0625rem/1.7 var(--body);text-rendering:optimizeLegibility}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;z-index:20;background:var(--safed);color:var(--kaala);padding:.5rem 1rem;font-weight:700}
.skip:focus{left:1rem;top:1rem}
.wrap{max-width:72rem;margin-inline:auto;padding-inline:1rem}

.topbar{background:var(--neel);color:var(--safed)}
.topbar-in{display:flex;align-items:center;gap:1rem;min-height:4rem}

.topnav{display:none;gap:1.5rem;margin-left:auto}
.topnav a{color:var(--safed);text-decoration:none;font-weight:700}
.topnav a:hover{text-decoration:underline;text-underline-offset:.3em}
.topbar .btn-sub{margin-left:auto}
@media (min-width:40rem){.topnav{display:flex}.topbar .btn-sub{margin-left:0}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.875rem;padding:.55rem 1.2rem;border-radius:6px;border:2px solid transparent;font:700 1rem/1.2 var(--body);text-decoration:none;cursor:pointer}
.btn-primary{background:var(--sindoor);color:var(--safed);box-shadow:inset 0 0 0 3px var(--sindoor),inset 0 0 0 5px var(--haldi)}
.btn-primary:hover{background:var(--sindoor-gaadha);box-shadow:inset 0 0 0 3px var(--sindoor-gaadha),inset 0 0 0 5px var(--haldi)}
.btn-ghost{background:transparent;color:var(--neel);border-color:var(--neel)}

.btn-sub{background:var(--haldi);color:var(--kaala)}

.btn-wa{background:var(--whatsapp);color:var(--kaala)}

.plate-sm{font-size:.8125rem;padding:.2rem .6rem;box-shadow:inset 0 0 0 2px var(--neel),inset 0 0 0 3px var(--haldi)}
.hero{background:var(--haldi);padding-block:1.75rem 2.75rem;border-bottom:6px solid var(--sindoor)}
.wordmark{display:grid;font-family:var(--display);font-weight:400;font-size:clamp(4.5rem,24vw,13rem);line-height:1.25;margin:0;user-select:none}
.wm{grid-area:1/1;white-space:nowrap}

  .wm-b{animation:neeche .8s cubic-bezier(.2,.8,.2,1) .25s both}
}
@keyframes upar{from{transform:translateX(0)}to{transform:translateX(-.025em)}}
